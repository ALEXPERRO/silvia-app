<nav
  class="md:hidden fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 z-50 bg-brand shadow-lg h-12 flex items-center justify-center overflow-hidden transition-[width,border-radius] duration-300 ease-in-out"
  [class]="collapsed() ? 'w-12 rounded-3xl' : 'w-[calc(100%-2rem)] rounded-2xl px-2'"
>
  @if (collapsed()) {
    <button
      type="button"
      (click)="expand()"
      class="w-full h-full flex items-center justify-center text-white"
      [attr.aria-label]="'NAV.OPEN_MENU_ARIA' | translate"
    >
      <app-icon name="menu" [size]="18" />
    </button>
  } @else {
    <ul class="flex items-center justify-around w-full font-semibold text-[10px] tracking-widest uppercase">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="text-white"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="text-white/70 hover:text-white transition-colors whitespace-nowrap"
          >
            {{ item.labelKey | translate }}
          </a>
        </li>
      }
    </ul>
  }
</nav>
