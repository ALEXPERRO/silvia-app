<nav
  class="md:hidden fixed bottom-4 inset-x-4 z-50 bg-brand-soft border border-gray-200 rounded-2xl shadow-lg"
>
  <ul class="flex items-center justify-around py-3 px-2 font-semibold text-[10px] tracking-widest uppercase">
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="active text-brand"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="hover:text-brand transition-colors whitespace-nowrap"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
