<nav
  class="hidden md:block fixed top-0 left-0 w-full bg-parchment text-gray-800 z-50 shadow-sm border-b border-gray-200"
>
  <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 md:py-4 flex items-center justify-between gap-4">
    <a routerLink="/" class="shrink-0 flex items-center -my-1" [attr.aria-label]="'NAV.HOME_LOGO_ARIA' | translate">
      <img src="images/logo/title-plum-nav.webp" width="360" height="224" alt="Blooming Wild ART" class="h-16 md:h-20 w-auto max-w-none shrink-0 -ml-6" />
    </a>

    <ul class="flex items-center gap-4 md:gap-8 font-semibold text-[11px] md:text-base tracking-widest uppercase">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active text-brand"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="nav-link hover:text-brand transition-colors whitespace-nowrap"
          >
            {{ item.labelKey | translate }}
          </a>
        </li>
      }
    </ul>

    <app-language-toggle />
  </div>
</nav>
