<nav
  class="hidden md:block fixed top-0 left-0 w-full bg-parchment text-gray-800 z-50 shadow-sm border-b border-gray-200"
>
  <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 flex items-center justify-center gap-4">
    <ul class="flex items-center gap-4 md:gap-7 font-semibold text-[11px] md:text-sm tracking-widest uppercase">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active text-brand"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="nav-link hover:text-brand transition-colors whitespace-nowrap"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
