<footer class="bg-white text-gray-800 pt-10 pb-24 md:pb-10 px-4 border-t border-gray-200 z-20 relative text-sm">
  <div class="max-w-2xl mx-auto flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16">
    <!-- Identità: logo + nome -->
    <div class="flex items-center gap-3">
      <img
        src="images/logo/logo-badge.webp"
        width="200"
        height="200"
        alt=""
        class="w-12 h-12 md:w-14 md:h-14 rounded-full shadow-warm border-2 border-blush shrink-0"
      />
      <p class="font-title italic text-2xl tracking-wide text-brand">{{ footer.text }}</p>
    </div>

    <span class="hidden md:block w-px self-stretch bg-gray-200"></span>

    <!-- Azioni: contatti e lingua -->
    <div class="flex items-center gap-4">
      <a href="https://www.instagram.com/blooming.wild.art/" target="_blank" rel="noopener" aria-label="Instagram" class="inline-flex items-center justify-center text-gray-600 hover:text-brand transition-colors">
        <app-icon name="instagram" [size]="26" />
      </a>
      <a href="mailto:silvia.sgara@gmail.com" [attr.aria-label]="'FOOTER.EMAIL_ARIA' | translate" class="inline-flex items-center justify-center text-gray-600 hover:text-brand transition-colors">
        <app-icon name="mail" [size]="26" />
      </a>
      <span class="md:hidden w-px h-4 bg-gray-200"></span>
      <app-language-toggle class="md:hidden" [compact]="true" />
    </div>
  </div>

  <p class="text-center text-xs text-gray-500 tracking-wider font-light mt-8">{{ footer.credits }}</p>
</footer>
