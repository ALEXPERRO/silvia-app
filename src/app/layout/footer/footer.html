<footer class="bg-white text-gray-800 text-center pt-10 pb-24 md:pb-10 px-4 border-t border-gray-200 z-20 relative text-sm">
  <div class="flex items-center justify-center gap-3">
    <img
      src="images/logo/logo-badge.webp"
      width="200"
      height="200"
      alt=""
      class="w-12 h-12 md:w-14 md:h-14 rounded-full shadow-warm border-2 border-blush shrink-0"
    />
    <p class="font-title italic text-2xl tracking-wide text-brand">{{ footer.text }}</p>
  </div>

  <div class="flex items-center justify-center gap-5 mt-5">
    <a href="https://www.instagram.com/blooming.wild.art/" target="_blank" rel="noopener" aria-label="Instagram" class="inline-flex items-center justify-center text-gray-600 hover:text-brand transition-colors">
      <app-icon name="instagram" [size]="22" />
    </a>
    <a href="mailto:silvia.sgara@gmail.com" [attr.aria-label]="'FOOTER.EMAIL_ARIA' | translate" class="inline-flex items-center justify-center text-gray-600 hover:text-brand transition-colors">
      <app-icon name="mail" [size]="22" />
    </a>
  </div>

  <div class="mt-5">
    <p class="text-xs text-gray-500 mb-2.5">{{ 'FOOTER.SUPPORT_CAPTION' | translate }}</p>
    <a
      href="https://www.paypal.me/Zylvja"
      target="_blank"
      rel="noopener"
      class="inline-flex items-center gap-2 bg-brand text-white text-xs font-semibold tracking-widest uppercase px-5 py-2.5 rounded-full shadow-warm hover:bg-brand-hover hover:-translate-y-0.5 hover:shadow-warm-lg active:translate-y-0 transition-all"
    >
      <app-icon name="sparkles" [size]="14" /> {{ 'FOOTER.COFFEE_BUTTON' | translate }}
    </a>
  </div>

  <div class="mt-5 flex justify-center">
    <app-language-toggle />
  </div>

  <p class="text-xs text-gray-500 tracking-wider font-light mt-6">{{ footer.credits }}</p>
</footer>
