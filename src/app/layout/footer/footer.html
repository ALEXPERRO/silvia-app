<footer class="bg-white text-gray-800 text-center pt-10 pb-24 md:pb-10 px-4 border-t border-gray-200 z-20 relative text-sm">
  <p class="font-title italic text-2xl tracking-wide text-brand">{{ footer.text }}</p>

  <a href="https://www.instagram.com/blooming.wild.art/" target="_blank" rel="noopener" aria-label="Instagram" class="inline-flex items-center justify-center mt-5 text-gray-600 hover:text-brand transition-colors">
    <app-icon name="instagram" [size]="22" />
  </a>

  <div class="mt-5">
    <a
      href="https://www.paypal.me/Zylvja"
      target="_blank"
      rel="noopener"
      class="inline-flex items-center gap-2 bg-brand text-white text-xs font-semibold tracking-widest uppercase px-5 py-2.5 rounded-full shadow-sm hover:bg-brand-hover transition-colors"
    >
      <app-icon name="sparkles" [size]="14" /> Offrimi un caffè
    </a>
  </div>

  <p class="text-xs text-gray-500 tracking-wider font-light mt-6">{{ footer.credits }}</p>
</footer>
