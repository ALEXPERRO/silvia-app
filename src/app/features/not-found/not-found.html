<section class="min-h-[70vh] flex items-center justify-center bg-parchment pt-[calc(2rem+env(safe-area-inset-top))] md:pt-36 pb-14 px-4">
  <div class="flex flex-col items-center text-center max-w-md">
    <div class="relative w-16 h-16 flex items-center justify-center mb-6">
      <span class="absolute inset-0 rounded-full bg-plum-soft/50"></span>
      <app-icon name="map-pin" [size]="22" class="text-brand animate-twinkle" />
    </div>
    <h1 class="font-title italic text-2xl md:text-3xl text-gray-900 mb-2 tracking-wide">{{ 'NOT_FOUND.TITLE' | translate }}</h1>
    <p class="text-gray-600 text-sm md:text-base mb-6">{{ 'NOT_FOUND.TEXT' | translate }}</p>
    <a
      routerLink="/"
      class="inline-flex items-center gap-1.5 bg-action text-white text-xs font-semibold tracking-widest px-6 py-3.5 rounded hover:bg-action-hover hover:-translate-y-0.5 hover:shadow-warm active:translate-y-0 transition-all uppercase"
    >
      <app-icon name="leaf" [size]="14" /> {{ 'NOT_FOUND.CTA' | translate }}
    </a>
  </div>
</section>
